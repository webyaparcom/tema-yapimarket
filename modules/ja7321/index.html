<script>
  (() => {
    const P = "modulex-acilis-video-paralaks";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const video = (s, P, az) => {
      const v = s.querySelector("video");
      const b = s.querySelector("[data-video]");
      if (!v || !b) return;
      const ik = b.querySelector("span");
      const yaz = (oynuyor) => {
        b.setAttribute("aria-label", oynuyor ? b.dataset.durdur : b.dataset.oynat);
        b.setAttribute("aria-pressed", String(!oynuyor));
        if (ik) ik.textContent = oynuyor ? "pause" : "play_arrow";
      };
      if (az) { v.removeAttribute("autoplay"); v.pause(); yaz(false); }
      b.addEventListener("click", () => {
        if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => yaz(false)); yaz(true); } else { v.pause(); yaz(false); }
      });
    };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      video(s, P, az);
    });
  })();
</script>
