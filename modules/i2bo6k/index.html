<section class="modulex-fq2" {{fq2label}}>
  <div class="modulex-fq2__wrap">
    <div class="modulex-fq2__intro">
      {{fq2head}}
      {{fq2cta}}
    </div>
    <div class="modulex-fq2__list">{{fq2items}}</div>
  </div>
</section>

<style>
  /* faq-2 — iki sütun SSS (1 Kas 2026). Renkler yalnız var(--mx-site-*) token'ları. */
  .modulex-fq2 { box-sizing: border-box; width: 100%; padding: clamp(48px, 7vw, 96px) clamp(16px, 4vw, 32px); background: var(--mx-site-bg, #ffffff); color: var(--mx-site-text, #1b1b1b); }
  .modulex-fq2 *, .modulex-fq2 *::before, .modulex-fq2 *::after { box-sizing: border-box; }
  .modulex-fq2__wrap { max-width: --max--; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: clamp(28px, 5vw, 72px); align-items: start; }
  .modulex-fq2__intro { position: sticky; top: 96px; }
  .modulex-fq2__head { max-width: 760px; margin-block-end: clamp(24px, 4vw, 40px); }
  .modulex-fq2__eyebrow { margin: 0 0 8px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mx-site-primary, #2563eb); }
  .modulex-fq2__h2 { margin: 0 0 10px; font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2.25rem); line-height: 1.2; color: var(--mx-site-text, #1b1b1b); }
  .modulex-fq2__desc { margin: 0; font-size: 1rem; line-height: 1.65; color: color-mix(in srgb, var(--mx-site-text, #1b1b1b) 74%, transparent); }
  .modulex-fq2__cta { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 11px 22px; border-radius: 12px; font-weight: 700; text-decoration: none; background: var(--mx-site-primary, #2563eb); color: var(--mx-site-primary-contrast, #ffffff); }
  .modulex-fq2__cta:hover { background: color-mix(in srgb, var(--mx-site-primary, #2563eb) 86%, var(--mx-site-text, #1b1b1b)); }
  .modulex-fq2__cta:focus-visible { outline: 3px solid var(--mx-site-primary, #2563eb); outline-offset: 3px; }
  .modulex-fq2__list { border-block-start: 1px solid color-mix(in srgb, var(--mx-site-text, #1b1b1b) 16%, transparent); }
  .modulex-fq2__item { border-block-end: 1px solid color-mix(in srgb, var(--mx-site-text, #1b1b1b) 16%, transparent); }
  .modulex-fq2__q { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 18px 4px; cursor: pointer; font-size: 1.05rem; font-weight: 700; color: var(--mx-site-text, #1b1b1b); }
  .modulex-fq2__q::-webkit-details-marker { display: none; }
  .modulex-fq2__q:hover { color: var(--mx-site-primary, #2563eb); }
  .modulex-fq2__q:focus-visible { outline: 3px solid var(--mx-site-primary, #2563eb); outline-offset: 2px; border-radius: 6px; }
  .modulex-fq2__ic { flex: none; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--mx-site-text, #1b1b1b) 22%, transparent); transition: transform 0.25s ease; }
  .modulex-fq2__item[open] .modulex-fq2__ic { transform: rotate(45deg); }
  .modulex-fq2__a { padding: 0 48px 20px 4px; font-size: 0.98rem; line-height: 1.7; color: color-mix(in srgb, var(--mx-site-text, #1b1b1b) 80%, transparent); }
  .modulex-fq2__a p { margin: 0; }
  @media (max-width: 860px) {
    .modulex-fq2__wrap { grid-template-columns: 1fr; }
    .modulex-fq2__intro { position: static; }
    .modulex-fq2__a { padding-inline-end: 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-fq2 * { transition: none !important; animation: none !important; }
  }
</style>
