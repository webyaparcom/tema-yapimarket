<style>
  /* zaman-dikey-yil — Yıl okunacak bir sayı değil, bloğun sırtına yazılmış bir etiket (kitap sırtı gibi); bloklar alt alta, eksen çizgisi yok. */
  .modulex-zaman-dikey-yil { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-zaman-dikey-yil *, .modulex-zaman-dikey-yil *::before, .modulex-zaman-dikey-yil *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-zaman-dikey-yil :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-zaman-dikey-yil :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-zaman-dikey-yil :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-zaman-dikey-yil :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-zaman-dikey-yil img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-zaman-dikey-yil) img { height: auto; }
  .modulex-zaman-dikey-yil [hidden] { display: none !important; }
  .modulex-zaman-dikey-yil :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-zaman-dikey-yil :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-zaman-dikey-yil-ic { max-width: --max--; margin-inline: auto; }
  .modulex-zaman-dikey-yil-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-zaman-dikey-yil--bassiz .modulex-zaman-dikey-yil-bas { display: none; }
  .modulex-zaman-dikey-yil-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-zaman-dikey-yil-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-zaman-dikey-yil-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-zaman-dikey-yil-bas { max-width: 760px; }
  .modulex-zaman-dikey-yil-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-zaman-dikey-yil-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-zaman-dikey-yil-dugme:hover { transform: translateY(-2px); }
  .modulex-zaman-dikey-yil-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-zaman-dikey-yil-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-zaman-dikey-yil-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-zaman-dikey-yil-liste { display: grid; gap: 18px; }
  .modulex-zaman-dikey-yil-blok { position: relative; display: grid; grid-template-columns: 64px minmax(0, 1fr); min-height: 170px; overflow: hidden; border-radius: --yuvarlak--; background-color: --kartBg--; transition: transform 0.3s ease, box-shadow 0.3s ease; }
  .modulex-zaman-dikey-yil-blok--gorsel { grid-template-columns: 64px minmax(0, 1.3fr) minmax(0, 1fr); }
  .modulex-zaman-dikey-yil-blok:hover { transform: translateX(6px); box-shadow: 0 18px 36px -28px color-mix(in srgb, --text-- 60%, transparent); }
  .modulex-zaman-dikey-yil-blok:hover:dir(rtl) { transform: translateX(-6px); }
  .modulex-zaman-dikey-yil-sirt { display: grid; place-items: center; padding-block: 18px; background-color: --vurguBg--; color: --vurguText--; }
  .modulex-zaman-dikey-yil-yil { color: inherit; font-size: 1.5rem; font-weight: 800; letter-spacing: 0.08em; writing-mode: vertical-rl; transform: rotate(180deg); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .modulex-zaman-dikey-yil-icerik { display: grid; align-content: center; gap: 8px; padding: clamp(20px, 3vw, 32px); }
  .modulex-zaman-dikey-yil-ikon { color: --accentInk--; font-size: 26px; }
  .modulex-zaman-dikey-yil-kbaslik { font-size: 1.25rem; font-weight: 750; }
  .modulex-zaman-dikey-yil-kmetin { color: --muted--; }
  .modulex-zaman-dikey-yil-gorsel { width: 100%; height: 100%; min-height: 170px; object-fit: cover; }
  .modulex-zaman-dikey-yil--hazir:not(.modulex-zaman-dikey-yil--gor) .modulex-zaman-dikey-yil-blok { opacity: 0; transform: translateY(14px); }
  .modulex-zaman-dikey-yil-blok { transition: transform 0.5s ease, box-shadow 0.3s ease, opacity 0.5s ease; }
  @media (max-width: 768px) {
    .modulex-zaman-dikey-yil-blok, .modulex-zaman-dikey-yil-blok--gorsel { grid-template-columns: 48px minmax(0, 1fr); }
    .modulex-zaman-dikey-yil-blok--gorsel .modulex-zaman-dikey-yil-gorsel { grid-column: 1 / -1; min-height: 0; aspect-ratio: 16 / 9; }
    .modulex-zaman-dikey-yil-yil { font-size: 1.2rem; }
  }
  .modulex-zaman-dikey-yil-bag { color: inherit; text-decoration: none; }
  .modulex-zaman-dikey-yil-bag::after { content: ""; position: absolute; inset: 0; z-index: 3; }
  .modulex-zaman-dikey-yil-bag:hover { text-decoration: underline; text-underline-offset: 4px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-zaman-dikey-yil :is(.modulex-zaman-dikey-yil-baslik, .modulex-zaman-dikey-yil-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-zaman-dikey-yil-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-zaman-dikey-yil { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-zaman-dikey-yil *, .modulex-zaman-dikey-yil *::before, .modulex-zaman-dikey-yil *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-zaman-dikey-yil";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
